<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DSH Desktop</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    :root {
      --ds-blue: #4D6BFE;
      --ds-blue-soft: #8FA3FF;
      --splash-bg: #0A0E1B;
      --splash-text: #E8EAF3;
      --splash-dim: #8A90A8;
    }
    html, body { height: 100%; }
    body {
      /* true vertical centering: the flex container must own full height */
      display: flex; align-items: center; justify-content: center;
      background: var(--splash-bg);
      overflow: hidden;
    }

    /* ---- ambient background (pure CSS, GPU-composited transform/opacity only) ---- */
    .bg { position: fixed; inset: 0; pointer-events: none; }
    .glow {
      position: absolute; border-radius: 50%;
      filter: blur(90px); opacity: .16;
      will-change: transform;
    }
    .g1 {
      width: 520px; height: 520px; left: -140px; top: -160px;
      background: radial-gradient(circle, var(--ds-blue), transparent 70%);
      animation: drift1 26s ease-in-out infinite alternate;
    }
    .g2 {
      width: 460px; height: 460px; right: -120px; bottom: -140px;
      background: radial-gradient(circle, #1E8FE8, transparent 70%);
      opacity: .10;
      animation: drift2 34s ease-in-out infinite alternate;
    }
    .g3 {
      width: 300px; height: 300px; left: 55%; top: 12%;
      background: radial-gradient(circle, #7C8CF8, transparent 70%);
      opacity: .08;
      animation: drift3 30s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translate(70px, 50px) scale(1.08); } }
    @keyframes drift2 { to { transform: translate(-60px, -40px) scale(1.1); } }
    @keyframes drift3 { to { transform: translate(-50px, 60px) scale(0.94); } }

    /* ---- centered core ---- */
    .splash {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      padding: 32px 24px;
    }
    .emblem {
      position: relative; width: 104px; height: 104px; margin-bottom: 26px;
      display: flex; align-items: center; justify-content: center;
    }
    /* rotating arc ring */
    .ring {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg,
        transparent 0deg, transparent 250deg,
        var(--ds-blue) 300deg, transparent 350deg, transparent 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
              mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
      animation: ring-spin 2.2s linear infinite;
    }
    .ring2 {
      position: absolute; inset: 12px; border-radius: 50%;
      border: 1px solid rgba(77, 107, 254, .25);
    }
    .whale {
      width: 58px; height: 58px;
      filter: drop-shadow(0 0 14px rgba(77, 107, 254, .55));
      animation: breathe 3.6s ease-in-out infinite alternate;
      will-change: transform, filter;
    }
    @keyframes ring-spin { to { transform: rotate(360deg); } }
    @keyframes breathe {
      from { transform: scale(1); filter: drop-shadow(0 0 10px rgba(77,107,254,.4)); }
      to   { transform: scale(1.06); filter: drop-shadow(0 0 22px rgba(77,107,254,.75)); }
    }

    .brand {
      font-size: 21px; font-weight: 600; letter-spacing: .2px;
      color: var(--splash-text);
    }
    .brand-sub {
      margin-top: 4px; font-size: 12px; letter-spacing: 3px;
      color: var(--splash-dim); text-transform: uppercase;
    }

    /* ---- progress ---- */
    .track {
      width: 264px; height: 4px; margin-top: 30px;
      background: rgba(255, 255, 255, .08);
      border-radius: 999px; overflow: hidden;
    }
    .fill {
      height: 100%; width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #3653E8, var(--ds-blue), var(--ds-blue-soft));
      box-shadow: 0 0 10px rgba(77, 107, 254, .55);
      transition: width .4s cubic-bezier(.3, .7, .3, 1);
    }
    .meta {
      display: flex; align-items: baseline; gap: 10px;
      margin-top: 12px; min-height: 20px;
    }
    .stage { font-size: 13px; color: var(--splash-text); }
    .percent {
      font-size: 13px; color: var(--ds-blue-soft);
      font-variant-numeric: tabular-nums;
    }
    .status {
      margin-top: 4px; min-height: 18px; max-width: 420px;
      font-size: 12px; color: var(--splash-dim); text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ---- error state ---- */
    .error {
      margin-top: 22px; width: 380px; max-width: 84vw;
      background: rgba(248, 113, 113, .07);
      border: 1px solid rgba(248, 113, 113, .35);
      border-radius: 12px; padding: 14px 16px;
    }
    .error-text { color: #F87171; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
    .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
    .btn-row button {
      padding: 8px 18px; border: 1px solid rgba(255, 255, 255, .14); border-radius: 8px;
      background: rgba(255, 255, 255, .05); color: var(--splash-text);
      cursor: pointer; font-size: 13px; font-family: inherit;
    }
    .btn-row button:hover { border-color: var(--ds-blue); }
    .btn-row button.primary { background: var(--ds-blue); border-color: var(--ds-blue); }
    .btn-row button.primary:hover { filter: brightness(1.1); }
    body.error-state .ring, body.error-state .whale { animation-play-state: paused; }
    body.error-state .whale { filter: drop-shadow(0 0 12px rgba(248,113,113,.5)); }

    /* ---- custom window title bar (main window is undecorated) ---- */
    .winbar {
      position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 10;
      display: flex; align-items: center; justify-content: flex-end;
      padding: 0 8px;
      -webkit-user-select: none; user-select: none;
    }
    .win-btns { display: flex; align-items: center; gap: 2px; }
    .win-btns button {
      width: 34px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: none; border-radius: 6px;
      color: var(--splash-dim); cursor: pointer; padding: 0;
    }
    .win-btns button:hover { background: rgba(255, 255, 255, .08); color: var(--splash-text); }
    .win-btns button.danger:hover { background: #e81123; color: #fff; }
    .win-btns svg { width: 10px; height: 10px; display: block; pointer-events: none; }

    @media (prefers-reduced-motion: reduce) {
      .ring, .whale, .g1, .g2, .g3 { animation: none; }
      .fill { transition: none; }
    }
  </style>
</head>
<body>
  <div class="winbar" data-tauri-drag-region="deep">
    <div class="win-btns">
      <button id="win-min" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="win-max" title="最大化" aria-label="最大化">
        <svg viewBox="0 0 10 10" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="win-close" class="danger" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
    </div>
  </div>
  <div class="bg" aria-hidden="true">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="glow g3"></div>
  </div>
  <div class="splash">
    <div class="emblem">
      <div class="ring"></div>
      <div class="ring2"></div>
      <img class="whale" src="whale.svg" alt="DeepSeek" />
    </div>
    <div class="brand">DeepSeek Harness</div>
    <div class="brand-sub">Desktop</div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="meta">
      <span class="stage" id="stage">正在启动 DeepSeek Harness 服务</span>
      <span class="percent" id="percent">0%</span>
    </div>
    <div class="status" id="status"></div>
    <div class="error" id="error" hidden>
      <p class="error-text" id="error-text"></p>
      <div class="btn-row">
        <button class="primary" id="retry">重试</button>
        <button id="open-settings">打开设置与日志</button>
      </div>
    </div>
  </div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    const STAGE_LABELS = {
      extract: '正在解压运行时组件',
      boot: '正在启动 DeepSeek Harness 服务',
      ready: '服务已就绪',
    };

    const $ = (id) => document.getElementById(id);
    let percent = 0;
    let lastStage = 'boot';
    const setProgress = (p) => {
      percent = p;
      $('fill').style.width = p + '%';
      $('percent').textContent = p + '%';
    };
    const setStage = (stage, detail) => {
      if (stage !== lastStage) {
        // a new stage restarts the monotonic floor (extract → boot → ready)
        lastStage = stage;
        percent = -1;
        $('stage').textContent = STAGE_LABELS[stage] || detail || '';
      }
      if (detail) $('status').textContent = detail;
    };
    const applyProgress = (stage, v) => {
      setStage(stage);
      if (Number.isFinite(v)) setProgress(Math.max(percent, v));
    };

    let redirecting = false;
    const go = (url) => {
      if (redirecting) return;
      redirecting = true;
      location.replace(url);
    };

    listen('dsh-status', (e) => { $('status').textContent = String(e.payload); });
    listen('dsh-progress', (e) => {
      const p = e.payload || {};
      const stage = p.stage || 'boot';
      setStage(stage, p.detail);
      const v = Number(p.percent);
      applyProgress(stage, v);
    });
    listen('dsh-ready', (e) => { setProgress(100); go(String(e.payload)); });
    listen('dsh-failed', () => {
      document.body.classList.add('error-state');
      $('error').hidden = false;
      $('error-text').textContent =
        'DeepSeek Harness 服务启动失败。\n可能原因：内置运行时缺失、端口被占用且不可用、或 dsh 配置损坏。\n请打开设置与日志查看详情。';
    });
    $('retry').addEventListener('click', () => location.reload());
    $('open-settings').addEventListener('click', () => invoke('open_settings_window'));

    // ---- custom window controls (main window is undecorated) ----
    if (window.__TAURI__ && window.__TAURI__.window) {
      const win = window.__TAURI__.window.getCurrentWindow();
      const MAX_SVG =
        '<svg viewBox="0 0 10 10" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
      const RESTORE_SVG =
        '<svg viewBox="0 0 10 10" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1" d="M2.5 2.5V.5h7v7h-2"/><rect x=".5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
      const syncMax = async () => {
        try {
          const maximized = await win.isMaximized();
          $('win-max').innerHTML = maximized ? RESTORE_SVG : MAX_SVG;
          $('win-max').title = maximized ? '向下还原' : '最大化';
          $('win-max').setAttribute('aria-label', maximized ? '向下还原' : '最大化');
        } catch (e) { /* window not ready yet */ }
      };
      $('win-min').addEventListener('click', () => win.minimize());
      $('win-max').addEventListener('click', () => win.toggleMaximize());
      $('win-close').addEventListener('click', () => win.close());
      win.onResized(syncMax);
      syncMax();
    }

    // Deterministic fallback: poll the shell state instead of relying on
    // events alone (events can fire before this page registers listeners).
    async function pollStatus() {
      try {
        const st = await invoke('get_status');
        if (st.ui_ready) {
          setProgress(100);
          go(`http://127.0.0.1:${st.dsh_port}/`);
          return;
        }
        if (st.adopted) {
          $('status').textContent = '检测到已有 DeepSeek Harness 实例，正在接入…';
        }
      } catch (e) { /* window may not be ready yet */ }
      setTimeout(pollStatus, 500);
    }
    pollStatus();
  </script>
</body>
</html>
