<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DSH Desktop</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="splash.css" />
  <script>
    // persisted motion intensity injected by the shell before page scripts —
    // apply it before first paint so ambient animation never flashes the
    // wrong mode
    document.documentElement.dataset.motion =
      window.__DSH_MOTION__ === 'quiet' ? 'quiet' : 'rich';
  </script>
</head>
<body>
  <div class="winbar" data-tauri-drag-region="deep">
    <div class="win-btns">
      <button id="win-min" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="win-max" title="最大化" aria-label="最大化">
        <svg viewBox="0 0 10 10" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="win-close" class="danger" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
    </div>
  </div>

  <div class="bg" aria-hidden="true">
    <div class="glow g1 drift-a"></div>
    <div class="glow g2 drift-b"></div>
    <div class="glow g3 drift-c"></div>
  </div>

  <div class="waves" aria-hidden="true">
    <div class="wv wv-b">
      <svg viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 100 C90 62 210 62 300 100 C390 138 510 138 600 100 C690 62 810 62 900 100 C990 138 1110 138 1200 100 V120 H0 Z" fill="rgba(60,140,220,.10)"/></svg>
    </div>
    <div class="wv wv-a">
      <svg viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 84 C75 46 225 46 300 84 C375 122 525 122 600 84 C675 46 825 46 900 84 C975 122 1125 122 1200 84 V120 H0 Z" fill="rgba(77,107,254,.16)"/></svg>
    </div>
  </div>

  <div class="bubbles" aria-hidden="true">
    <span class="bubble" style="--bx:8%;  --bs:7px;  --bd:15s; --bdelay:-2s;  --bop:.45; --bsx:14px"></span>
    <span class="bubble" style="--bx:16%; --bs:4px;  --bd:19s; --bdelay:-7s;  --bop:.35; --bsx:-10px"></span>
    <span class="bubble" style="--bx:31%; --bs:9px;  --bd:13s; --bdelay:-11s; --bop:.5;  --bsx:18px"></span>
    <span class="bubble" style="--bx:47%; --bs:5px;  --bd:21s; --bdelay:-4s;  --bop:.4;  --bsx:-14px"></span>
    <span class="bubble" style="--bx:62%; --bs:8px;  --bd:16s; --bdelay:-9s;  --bop:.45; --bsx:12px"></span>
    <span class="bubble" style="--bx:74%; --bs:4px;  --bd:23s; --bdelay:-14s; --bop:.3;  --bsx:-12px"></span>
    <span class="bubble" style="--bx:86%; --bs:6px;  --bd:17s; --bdelay:-6s;  --bop:.4;  --bsx:16px"></span>
    <span class="bubble" style="--bx:94%; --bs:10px; --bd:12s; --bdelay:-1s;  --bop:.5;  --bsx:-16px"></span>
  </div>

  <div class="splash">
    <div class="emblem">
      <div class="ring"></div>
      <div class="ring2"></div>
      <span class="ripple" aria-hidden="true"></span>
      <img class="whale" src="whale.svg" alt="DeepSeek" />
    </div>
    <div class="brand">DeepSeek Harness</div>
    <div class="brand-sub">Desktop</div>
    <div class="brand-meta" aria-label="应用信息">
      <span class="brand-meta-item" id="app-version" hidden></span>
      <span class="brand-meta-separator" id="brand-meta-separator" hidden aria-hidden="true"></span>
      <span class="brand-meta-item">作者 <strong>Anixuil</strong></span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="meta">
      <span class="stage" id="stage">正在启动 DeepSeek Harness 服务</span>
      <span class="percent" id="percent">0%</span>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="startup-choice" id="startup-choice" hidden role="dialog" aria-modal="true" aria-labelledby="startup-choice-title">
    <div class="startup-choice-card">
      <div class="startup-choice-kicker">已有服务</div>
      <h1 id="startup-choice-title">检测到本机已有 DSH Desktop 服务</h1>
      <p>检测到 DSH、桌面桥接和凭据服务都可以正常访问。请选择本次启动方式。</p>
      <div class="startup-ports" id="startup-ports"></div>
      <div class="startup-choice-actions">
        <button id="startup-existing">接入已有实例</button>
        <button class="primary" id="startup-independent">独立运行</button>
      </div>
      <div class="startup-choice-note">独立运行会结束当前占用这些端口的 DSH 服务实例。</div>
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    const STAGE_LABELS = {
      extract: '正在解压运行时组件',
      boot: '正在启动 DeepSeek Harness 服务',
      ready: '服务已就绪',
    };

    const $ = (id) => document.getElementById(id);
    let percent = 0;
    let lastStage = 'boot';

    const showStartupError = (text) => {
      let root = document.getElementById('startup-message-root');
      if (root) root.remove();
      root = document.createElement('div');
      root.id = 'startup-message-root';
      root.className = 'startup-message-root';
      root.setAttribute('role', 'alert');
      const content = document.createElement('p');
      content.textContent = text;
      const actions = document.createElement('div');
      actions.className = 'startup-message-actions';
      const retry = document.createElement('button');
      retry.className = 'primary';
      retry.type = 'button';
      retry.textContent = '重试';
      retry.addEventListener('click', () => location.reload());
      const settings = document.createElement('button');
      settings.type = 'button';
      settings.textContent = '打开设置与日志';
      settings.addEventListener('click', () => invoke('open_settings_window'));
      actions.append(retry, settings);
      root.append(content, actions);
      document.body.appendChild(root);
    };

    // ---- motion intensity ----
    const applyMotion = (m) => {
      document.documentElement.dataset.motion = m === 'quiet' ? 'quiet' : 'rich';
    };
    listen('motion-updated', (e) => {
      if (e.payload && e.payload.motion) applyMotion(e.payload.motion);
    });
    const reducedMotion = () =>
      window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const setProgress = (p) => {
      percent = p;
      $('fill').style.width = p + '%';
      $('percent').textContent = p + '%';
    };

    // stage label swap: old text sinks, new text surfaces
    let stageSwapTimer = 0;
    const swapStageLabel = (label) => {
      const el = $('stage');
      clearTimeout(stageSwapTimer);
      el.classList.add('dim');
      stageSwapTimer = setTimeout(() => {
        el.textContent = label;
        el.classList.remove('dim');
      }, 140);
    };
    const setStage = (stage, detail) => {
      if (stage !== lastStage) {
        // a new stage restarts the monotonic floor (extract → boot → ready)
        lastStage = stage;
        percent = -1;
        swapStageLabel(STAGE_LABELS[stage] || detail || '');
      }
      if (detail) $('status').textContent = detail;
    };
    const applyProgress = (stage, v) => {
      setStage(stage);
      if (Number.isFinite(v)) setProgress(Math.max(percent, v));
    };

    // ripple ring on the emblem — one per progress event
    const ripple = document.querySelector('.ripple');
    const triggerRipple = () => {
      if (!ripple) return;
      ripple.classList.remove('go');
      void ripple.offsetWidth; // restart the animation
      ripple.classList.add('go');
    };

    let redirecting = false;
    const go = (url) => {
      if (redirecting) return;
      redirecting = true;
      const dive = () => location.replace(url);
      // rich mode plays a short "dive" before handing over to the dsh page
      if (document.documentElement.dataset.motion === 'rich' && !reducedMotion()) {
        document.body.classList.add('dive');
        setTimeout(dive, 420);
      } else {
        dive();
      }
    };

    listen('dsh-status', (e) => { $('status').textContent = String(e.payload); });
    listen('dsh-progress', (e) => {
      const p = e.payload || {};
      const stage = p.stage || 'boot';
      setStage(stage, p.detail);
      const v = Number(p.percent);
      applyProgress(stage, v);
      if (!document.body.classList.contains('error-state')) triggerRipple();
    });
    listen('dsh-ready', (e) => { setProgress(100); go(String(e.payload)); });
    listen('dsh-startup-conflict', async () => {
      try { showStartupChoice(await invoke('get_startup_conflict')); } catch (e) { /* poll retries */ }
    });
    listen('dsh-failed', (e) => {
      document.body.classList.add('error-state');
      const failure = e.payload || {};
      showStartupError(failure.kind === 'runtime-extraction'
        ? `运行时组件解压失败：${failure.message || '系统暂时无法写入内置运行时文件。'}`
        : 'DeepSeek Harness 服务启动失败，请重试或打开设置与日志查看详情。');
    });

    const startupChoice = $('startup-choice');
    const startupPorts = $('startup-ports');
    const showStartupChoice = (conflict) => {
      if (!conflict || !Array.isArray(conflict.ports)) return;
      startupPorts.innerHTML = conflict.ports.filter((p) => p.occupied)
        .map((p) => `<span>${p.name} <b>127.0.0.1:${p.port}</b></span>`).join('');
      startupChoice.hidden = false;
    };
    const chooseStartup = async (mode) => {
      $('startup-existing').disabled = true;
      $('startup-independent').disabled = true;
      await invoke('choose_startup_mode', { mode });
      startupChoice.hidden = true;
    };
    $('startup-existing').addEventListener('click', () => chooseStartup('useExisting'));
    $('startup-independent').addEventListener('click', () => chooseStartup('independent'));

    // ---- custom window controls (main window is undecorated) ----
    if (window.__TAURI__ && window.__TAURI__.window) {
      const win = window.__TAURI__.window.getCurrentWindow();
      const MAX_SVG =
        '<svg viewBox="0 0 10 10" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
      const RESTORE_SVG =
        '<svg viewBox="0 0 10 10" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1" d="M2.5 2.5V.5h7v7h-2"/><rect x=".5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
      const syncMax = async () => {
        try {
          const maximized = await win.isMaximized();
          $('win-max').innerHTML = maximized ? RESTORE_SVG : MAX_SVG;
          $('win-max').title = maximized ? '向下还原' : '最大化';
          $('win-max').setAttribute('aria-label', maximized ? '向下还原' : '最大化');
        } catch (e) { /* window not ready yet */ }
      };
      $('win-min').addEventListener('click', () => win.minimize());
      $('win-max').addEventListener('click', () => win.toggleMaximize());
      $('win-close').addEventListener('click', () => win.close());
      win.onResized(syncMax);
      syncMax();
    }

    // Deterministic fallback: poll the shell state instead of relying on
    // events alone (events can fire before this page registers listeners).
    async function pollStatus() {
      try {
        const st = await invoke('get_status');
        if (st.motionIntensity) applyMotion(st.motionIntensity);
        if (st.appVersion) {
          const version = $('app-version');
          version.textContent = `版本 v${st.appVersion}`;
          version.hidden = false;
          $('brand-meta-separator').hidden = false;
        }
        if (st.uiReady) {
          setProgress(100);
          go(`http://127.0.0.1:${st.dshPort}/`);
          return;
        }
        if (st.adopted) {
          $('status').textContent = '检测到已有 DeepSeek Harness 实例，正在接入…';
        }
        const conflict = await invoke('get_startup_conflict');
        if (conflict) showStartupChoice(conflict);
      } catch (e) { /* window may not be ready yet */ }
      setTimeout(pollStatus, 500);
    }
    pollStatus();
  </script>
</body>
</html>
