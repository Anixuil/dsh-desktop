[package]
name = "dsh-desktop"
version = "0.2.0"
description = "DeepSeek Harness desktop shell"
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiny_http = "0.12"
chrono = "0.4"
# Volcengine OpenAPI (balance/usage) request signing: HMAC-SHA256 + hex.
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["time"] }
keyring = "3"
# zlib-rs backend: SIMD-accelerated pure-Rust gzip, several times faster than
# the default miniz_oxide for first-run runtime extraction (no C toolchain).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
log = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
