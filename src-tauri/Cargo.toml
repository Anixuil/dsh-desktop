[package]
name = "dsh-desktop"
version = "0.2.1"
description = "DeepSeek Harness desktop shell"
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiny_http = "0.12"
chrono = "0.4"
# Volcengine OpenAPI (balance/usage) request signing: HMAC-SHA256 + hex.
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["time"] }
keyring = "3"
# zlib-rs backend: SIMD-accelerated pure-Rust gzip, several times faster than
# the default miniz_oxide for first-run runtime extraction (no C toolchain).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
log = "0.4"

[target.'cfg(windows)'.dependencies]
# Use the WinRT toast API directly so the installed app can report its own
# AppUserModelID and notification-send failures are observable by the shell.
tauri-winrt-notification = "0.7"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
